name: Enterprise AI evaluation
# Binding scope: retail_plus / Python / t2 / all 134 cases; resolved by platform config.
on:
  push:
    branches: ["main"]
    paths: ['agent/**', '.github/workflows/hyper-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: enterprise-ai-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evaluate:
    uses: mrvgao/enterprise-ai-evaluation/.github/workflows/evaluate.yml@v1.1.0
    with:
      binding-id: "d0f71d59-58f3-4d6f-a8e0-851da67bd787"
      api-url: "https://agentist.org/lab/api/enterprise-ai"
